# Copy to idrive6.toml and edit psdzdata to your extracted PSdZData directory.
psdzdata = "/path/to/psdzdata"

# Select the ECUs to start. The 6WB opens both the cluster and HUD.
modules = ["head-unit", "6wb"]

# Optional. Defaults to $XDG_CACHE_HOME/idrive6 or ~/.cache/idrive6.
# cacheDir = "/path/to/idrive6-cache"

# Optional window backend, or none for headless runs.
# macOS: cocoa (default). Linux and WSL2: sdl (default) or gtk.
# display = "sdl"

# Optional: 2 (default) or 1 for the slower single-core compatibility mode.
# cpuCount = 2

# Optional: code REMOTE_HMI active in the emulated head unit (never in a car),
# so the HMI starts its remoting bundle and loads plugin apps from
# /opt/hmi/ID5/data/ro/Plugins. Default false.
# pluginApps = true

# Optional, experimental: start a virtual V850 so the head unit gets car data
# (speed, gear, ignition, range, trip) over MOST. With the 6WB module running,
# the head unit follows the 6WB simulator's controls. Default false.
# carData = true
